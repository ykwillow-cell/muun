<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>페이지를 찾을 수 없습니다 | 무운사주</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #faf8f5; color: #292524; font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; }
      main { width: min(100%, 560px); padding: 48px 36px; text-align: center; background: #fff; border: 1px solid #e7e5e4; border-radius: 20px; box-shadow: 0 16px 50px rgba(41, 37, 36, 0.08); }
      p.code { margin: 0 0 10px; color: #a16207; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 36px); line-height: 1.3; }
      p.description { margin: 16px auto 28px; color: #57534e; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
      a { display: inline-block; padding: 12px 16px; color: #713f12; background: #fef3c7; border-radius: 10px; font-weight: 700; text-decoration: none; }
      a:hover, a:focus-visible { outline: 3px solid #fcd34d; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 NOT FOUND</p>
      <h1>요청하신 페이지를 찾을 수 없습니다.</h1>
      <p class="description">주소가 변경되었거나 더 이상 제공되지 않는 꿈해몽일 수 있습니다. 아래에서 관련 내용을 다시 찾아보세요.</p>
      <nav aria-label="추천 탐색 경로">
        <a href="/dream">꿈해몽 둘러보기</a>
        <a href="/fortune-dictionary">사주사전 보기</a>
        <a href="/">무운사주 홈으로</a>
      </nav>
    </main>
  </body>
</html>
