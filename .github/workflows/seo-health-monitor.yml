name: Weekly SEO Health Monitor

on:
  schedule:
    # 매주 월요일 11:17 KST (02:17 UTC)
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-seo-health:
    name: Production SEO health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check public production SEO contracts
        shell: bash
        run: |
          set -o pipefail
          node scripts/monitor-production-seo.mjs | tee -a "$GITHUB_STEP_SUMMARY"
