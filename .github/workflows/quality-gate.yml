name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type, test, audit, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript quality gate
        run: pnpm run check

      - name: Automated tests
        run: pnpm test

      - name: Block Critical and High dependency vulnerabilities
        run: pnpm audit --audit-level high

      - name: Production build and prerender integrity
        run: pnpm run build
